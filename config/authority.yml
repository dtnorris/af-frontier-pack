# AdventureFinder project-state authority consumed by af-frontier-pack.
# Paths are resolved relative to AF_PROJECT_ROOT unless absolute.
#
# The canonical contract lives in af-xlsx-data-sources/PROJECT_STATE.yml and
# uses schema adventurefinder-project-state/v0.1. af-frontier verifies the
# catalog_head version, filename, byte size, and SHA-256 before building.
state_manifests:
  - af-xlsx-data-sources/PROJECT_STATE.yml
role: catalog_head
schema_version: adventurefinder-project-state/v0.1
